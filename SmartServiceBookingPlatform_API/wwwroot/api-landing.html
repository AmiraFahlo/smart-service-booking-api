<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Service Booking API</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0F172A; /* Dark Theme Background */
            color: #E2E8F0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #38BDF8, #818CF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 2rem;
            width: 250px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border-color: #38BDF8;
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            margin: 0.5rem 0;
            color: #F8FAFC;
        }
        .card p {
            color: #94A3B8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <h1>Smart Service Booking API</h1>
    <div class="container">
        <!--SWAGGER_BUTTON_PLACEHOLDER-->
        <a href="/scalar/v1" class="card">
            <div class="card-icon">🚀</div>
            <h2>Scalar API Reference</h2>
            <p>Modern, high-performance API documentation.</p>
        </a>
    </div>
</body>
</html>
